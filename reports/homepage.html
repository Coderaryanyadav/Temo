    <style>
      /* Theme variables */
      :root {
        --dark-bg: #242424;
        --dark-container-bg: #171717;
        --light-bg: #f5f5f5;
        --light-container-bg: #ffffff;
      }

      /* Dark theme (default) */
      html,
      body {
        background-color: var(--dark-bg);
        overscroll-behavior-y: contain;
        height: 100%;
        -webkit-tap-highlight-color: transparent;
        /* Ensures body is at full height */
        overflow: hidden;
        /* Prevents unwanted scrolling */
        margin: 0;
      }

      #flutter_container {
        background-color: var(--dark-bg);
      }

      flt-glass-pane {
        background-color: transparent !important;
      }

      /* Full-width media pinned to the very top of the page during the web
         splash only. It's a direct child of <body> but removeWebSplashScreen()
         fades and removes it when Flutter takes over, so it lives only while the
         splash is up. Revealed only once the image has loaded (.has-top-banner) so
         there is no black flash, and it stays hidden if the image fails to load.
         pointer-events:none so it never blocks taps underneath. */
      #top-video-banner {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: calc(100vw * 320 / 3430);
        overflow: hidden;
        z-index: 100001;
        pointer-events: none;
      }

      body.has-top-banner #top-video-banner {
        display: block;
      }

      #top-video-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      #webframe-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--dark-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998;
      }

      #webframe-content {
        width: 100%;
        height: 100%;
        max-width: 100%;
        background: var(--dark-container-bg);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      /* Light theme */
      .theme-light html,
      .theme-light body {
        background-color: var(--light-bg);
      }

      .theme-light #flutter_container {
        background-color: var(--light-bg);
      }

      .theme-light #webframe-container {
        background: var(--light-bg);
      }

      .theme-light #webframe-content {
        background: var(--light-container-bg);
      }

      /* Desktop layout */
      @media (min-width: 550px) and (min-aspect-ratio: 3/5) {
        #webframe-content {
          max-width: calc(min(100vw, max(270px, 1.07 * 100vh * (375 / 812))));
        }
      }

      /* Mobile - full width */
      @media (max-width: 549px), (max-aspect-ratio: 3/5) {
        #webframe-container {
          background: var(--dark-container-bg);
        }

        #webframe-content {
          background: var(--dark-container-bg);
          max-width: 100%;
        }

        .theme-light #webframe-container {
          background: var(--light-container-bg);
        }

        .theme-light #webframe-content {
          background: var(--light-container-bg);
        }
      }

      #splash-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
      }

      #lottie-container {
        width: 160px;
        height: 170px;
      }

      /* Hide splash when Flutter is ready */
      .hidden {
        display: none;
      }

      #splash-screen .close-btn {
        color: white;
        margin-right: 8px;
        cursor: pointer;
        font-size: 18px;
      }

      #splash-screen .app-icon {
        width: 32px;
        height: 32px;
        margin-right: 8px;
      }

      #splash-screen .text-block {
        flex-grow: 1;
      }

      #splash-screen .title {
        font-size: 12px;
        line-height: 1.5;
        font-weight: 500;
      }

      #splash-screen .subtitle {
        font-size: 12px;
        line-height: 1.5;
        font-weight: 500;
      }

      #splash-screen .cta-button {
        background: #6678ff;
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        white-space: nowrap;
      }

      /* qr code styling */
      #qr-download-card {
        display: none;
        position: fixed;
        bottom: 30px;
        left: 60px;
        width: 209px;
        height: 299px;
        background: transparent;
        z-index: 99999;
      }

      #qr-download-card img {
        width: 100%;
        height: 100%;
        display: block;
      }

      #qr-android-link,
      #qr-ios-link {
        position: absolute;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        z-index: 2;
      }

      #qr-android-link {
        bottom: 70px;
        right: 70px;
      }

      #qr-ios-link {
        bottom: 70px;
        right: 40px;
      }

      /* Social links styling */
      #social-links {
        display: none;
        position: fixed;
        right: 60px;
        bottom: 30px;
        z-index: 99999;
      }

      .social-link {
        display: flex;
        align-items: center;
        color: white;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 13px;
        margin-left: 12px;
      }

      .social-icon {
        width: 20px;
        height: 20px;
        margin-right: 4px;
      }

      /* Show QR and social links on desktop when there's enough space */
      @media (min-width: 550px) and (min-aspect-ratio: 3/5) {
        @media (min-width: calc(270px + 510px)) {
          #qr-download-card {
            display: block;
          }

          #social-links {
            display: flex;
          }
        }
      }

        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      }

        document.addEventListener(
          "touchstart",
          (startEvent) => {
            if (startEvent.touches.length !== 1 || startEvent.changedTouches.length !== 1) return;

            const target = startEvent.composedPath()[0];

          if (os === "iOS") {

            window.location.href = ctaButton.href;
          }

          // For Android: let the browser open target="_blank" normally
        };

        if (os === "iOS") {
          ctaButton?.addEventListener("click", handleCTA, { passive: false });
          ctaButton?.addEventListener("touchstart", handleCTA, {
            passive: false,
          });
        }

        setTimeout(showGetApp, 3000);

      function getMobileOperatingSystem() {
        const userAgent =
          navigator.userAgent || navigator.vendor || window.opera;
        if (/windows phone/i.test(userAgent)) return "Windows Phone";
        if (/android/i.test(userAgent)) return "Android";
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream)
          return "iOS";
        return "unknown";
      }

      function shouldShowSideElements() {
        const screenWidth =
          window.innerWidth || document.documentElement.clientWidth;
        const screenHeight =
          window.innerHeight || document.documentElement.clientHeight;
        const isMobile = screenWidth < 550 || screenWidth / screenHeight < 0.6;

        if (isMobile) return false;

        const webFrameWidth = Math.min(
          screenWidth,
          Math.max(270, 1.07 * screenHeight * (375 / 812))
        );
        return screenWidth > webFrameWidth + 510;
      }

        const qrCard = document.getElementById("qr-download-card");

        if (shouldShowSideElements()) {

            ctaButton.href =

      function getThemePreference() {

        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
          const [name, value] = cookie.trim().split("=");
          if (name === "theme-preference") {
            return value;

        }

        // If no cookie, check system preference
        if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
          return "light";
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          return "dark";
        }

        // Default to dark if no preference detected
        return "dark";
      }

      function applyTheme() {
        const theme = getThemePreference();
        const html = document.documentElement;

        // Remove existing theme classes
        html.classList.remove("theme-light", "theme-dark");

        // Add appropriate theme class
        if (theme === "light") {
          html.classList.add("theme-light");
        } else {
          html.classList.add("theme-dark");
        }

      applyTheme();

      if (window.matchMedia) {

        let lastScrollTime = 0;
        let scrollAccumulator = 0;
        let isScrolling = false;

        // Function to find the Flutter container
        function findFlutterContainer() {
          const selectors = [
            "#flutter_container",
            "flt-glass-pane",
            "flt-scene-host",
            "[data-flt-scene-host]",
          ];

          for (const selector of selectors) {
            const element = document.querySelector(selector);
            if (element) {
              return element;
            }
          }

          return document.querySelector(
            "[data-flt-scene-host], flt-glass-pane, flt-scene-host"
          );
        }

        function forwardScrollToFlutter(deltaY) {
          if (!flutterContainer || !isFlutterReady) return;

          scrollAccumulator += deltaY;

          if (Math.abs(scrollAccumulator) < 5) return;

          if (!isScrolling) {
            isScrolling = true;
            requestAnimationFrame(() => {
              if (
                isFlutterReady &&
                flutterContainer &&
                Math.abs(scrollAccumulator) > 0
              ) {
                const wheelEvent = new WheelEvent("wheel", {
                  deltaY: scrollAccumulator,
                  deltaX: 0,
                  deltaZ: 0,
                  deltaMode: 0,
                  bubbles: true,
                  cancelable: true,
                  clientX: window.innerWidth / 2,
                  clientY: window.innerHeight / 2,
                  ctrlKey: false,
                  shiftKey: false,
                  altKey: false,
                  metaKey: false,
                });

                flutterContainer.dispatchEvent(wheelEvent);
                scrollAccumulator = 0;
              }
              isScrolling = false;
            });
          }
        }

        function checkFlutterReady() {
          flutterContainer = findFlutterContainer();
          if (flutterContainer) {
            isFlutterReady = true;
            console.log(
              "Desktop scroll forwarding enabled for Flutter container"
            );
          } else {
            setTimeout(checkFlutterReady, 1000);
          }
        }

        // Start checking for Flutter container
        checkFlutterReady();

        function handleScroll(e) {
          const now = Date.now();

          if (
            e.target === flutterContainer ||
            flutterContainer?.contains(e.target)
          ) {
            return;
          }

          if (now - lastScrollTime < 8) {
            return;
          }

          lastScrollTime = now;

          if (isFlutterReady && flutterContainer) {
            forwardScrollToFlutter(e.deltaY);
          }
        }

        // Add scroll listeners only for desktop (wheel events)
        document.addEventListener("wheel", handleScroll, { passive: true });
        window.addEventListener("wheel", handleScroll, { passive: true });

        // Less frequent re-checking
        setInterval(() => {
          if (!isFlutterReady) {
            checkFlutterReady();
          }
        }, 5000);
      });
    </script>
    <script>
      (function () {
        const isMobile = () => {
          const hasTouch =
            "ontouchstart" in window || navigator.maxTouchPoints > 0;

          const mobileUA =
            /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet|kindle|silk|playbook/i.test(
              navigator.userAgent || ""
            );

          const isIPad =
            (navigator.userAgent.includes("Mac") && hasTouch) ||
            /ipad/i.test(navigator.userAgent);

          const isSmallScreen =
            window.innerWidth <= 768 || window.innerHeight <= 768;

          const hasCoarsePointer =
            window.matchMedia("(pointer: coarse)").matches;

          const cannotHover = window.matchMedia("(hover: none)").matches;

          const hasOrientationAPI =
            "orientation" in window || "onorientationchange" in window;

          const mobilePlatform = /android|iphone|ipad|ipod/i.test(
            navigator.platform || ""
          );

          const multiTouch = navigator.maxTouchPoints > 1;

          const isMobileVendor =
            /apple|google|samsung/i.test(navigator.vendor || "") && hasTouch;

          return (
            mobileUA ||
            isIPad ||
            hasCoarsePointer ||
            cannotHover ||
            mobilePlatform ||
            (hasTouch && isSmallScreen) ||
            (hasTouch && hasOrientationAPI) ||
            (multiTouch && isSmallScreen) ||
            isMobileVendor
          );
        };

        if (isMobile()) {
          return;
        }

        function emitOutsideFlutterTap(event) {
          const flutterContainer =
            document.querySelector("#flutter_container") ||
            document.querySelector("flt-glass-pane");
          if (!flutterContainer) {
            return;
          }
          if (flutterContainer.contains(event.target)) {
            return;
          }
          
          
          const target = event.target;
          const tagName = target.tagName?.toLowerCase();
          const isInteractiveElement = 
            tagName === 'input' ||
            tagName === 'textarea' ||
            tagName === 'button' ||
            tagName === 'select' ||
            tagName === 'a' ||
            target.isContentEditable ||
            target.closest('input, textarea, button, select, a, [contenteditable="true"]');
          
          if (isInteractiveElement) {
            return;
          }
          
          window.dispatchEvent(new CustomEvent("flutter-outside-tap"));
        }

        document.addEventListener("mousedown", emitOutsideFlutterTap);
      })();
    </script>
  </body>
